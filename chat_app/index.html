<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinyGPT · Chat</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e9eaf1;background:#11131a;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr 260px;height:100dvh}.sidebar,.details{background:#171922;padding:24px 16px;overflow:auto}.sidebar{border-right:1px solid #292c38}.details{border-left:1px solid #292c38}.brand{font-size:19px;font-weight:750;letter-spacing:-.04em;margin:0 8px 28px}.brand span{color:#a89bff}.new{width:100%;background:#7362df;color:white;border:0;border-radius:9px;padding:12px;text-align:left;font-weight:650}.section{color:#85899a;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin:28px 8px 10px}.history button{display:block;width:100%;border:0;background:transparent;color:#b9bdcb;text-align:left;padding:10px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history button:hover,.history button.active{background:#292b39;color:#fff}.main{display:flex;flex-direction:column;min-width:0}.top{height:69px;border-bottom:1px solid #292c38;display:flex;align-items:center;padding:0 30px;font-weight:650}.top small{font-weight:400;color:#8e92a2;margin-left:12px}.messages{flex:1;overflow:auto;padding:35px max(24px,calc((100% - 760px)/2))}.empty{margin:16vh auto 0;text-align:center;color:#a2a6b6}.empty .mark{display:grid;place-items:center;margin:0 auto 20px;width:54px;height:54px;border-radius:17px;background:#29243f;color:#b8aaff;font-size:25px}.empty h1{color:#f3f3fa;font-size:26px;letter-spacing:-.04em;margin:0 0 8px}.message{margin-bottom:25px}.role{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#a99cff;margin-bottom:8px}.message.user .role{color:#9299ab}.bubble{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere;color:#e5e6ed}.composer{padding:0 max(24px,calc((100% - 760px)/2)) 22px}.box{border:1px solid #3a3d4c;border-radius:14px;background:#1d202b;padding:13px;display:flex;gap:10px;align-items:end}.box:focus-within{border-color:#8979ed}textarea{resize:none;background:none;border:0;outline:0;color:#fff;flex:1;min-height:48px;max-height:180px}.send{background:#8371ed;color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:650}.send:disabled{opacity:.5;cursor:wait}.hint{font-size:11px;color:#777c8c;text-align:center;margin:10px}.details h2{font-size:14px;margin:6px 8px 22px}.detail{margin:0 8px 18px}.detail label{display:block;color:#898e9e;font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}.detail div{font-size:13px;word-break:break-all;line-height:1.5}.settings input{width:100%;border:1px solid #393d4b;background:#20232e;border-radius:7px;padding:8px;color:#eee}.status{font-size:12px;color:#a9a1db;margin:12px 8px;min-height:16px}.error{color:#ff9a9a}@media(max-width:950px){.app{grid-template-columns:220px 1fr}.details{display:none}}@media(max-width:600px){.app{grid-template-columns:1fr}.sidebar{display:none}.top{padding:0 20px}.messages{padding:24px}.composer{padding:0 16px 16px}}
</style>
<style>.history-row{display:flex;align-items:center;min-width:0}.history-row .chat-open{flex:1;min-width:0}.history-row .chat-delete{width:auto;flex:none;padding:8px;color:#9b9dac;text-align:center}.history-row .chat-delete:hover{color:#ff9a9a;background:#38303a}.history-row .chat-delete:disabled{opacity:.4;cursor:not-allowed}</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><span>◈</span> tinygpt</div><button class="new" id="new">＋ &nbsp; New conversation</button><div class="section">Conversations</div><div class="history" id="history"></div></aside>
<main class="main"><header class="top">Chat <small>Local inference</small><button id="newMobile" style="margin-left:auto;background:none;border:0;color:#aaa">＋ New</button></header><div class="messages" id="messages"></div><div class="composer"><form class="box" id="form"><textarea id="input" placeholder="Send a message…" aria-label="Message" rows="2"></textarea><button class="send" id="send">Send ↑</button></form><div class="hint">Enter to send · Shift + Enter for a new line</div><div class="status" id="status" role="status"></div></div></main>
<aside class="details"><h2>Checkpoint</h2><div id="info"></div><div class="section">Generation</div><div class="settings"><div class="detail"><label for="tokens">Max new tokens</label><input id="tokens" type="number" min="1" max="1024" value="400"></div><div class="detail"><label for="temperature">Temperature</label><input id="temperature" type="number" min="0" max="3" step="0.1" value="0.8"></div><div class="detail"><label for="topk">Top K</label><input id="topk" type="number" min="0" max="10000" value="40"></div></div><div class="hint">Responses stop at the token limit. Earlier context is truncated when the model window fills.</div></aside>
</div><script>
const $=id=>document.getElementById(id); let current=null, busy=false;
async function api(path, options={}){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function show(messages){const container=$('messages');container.replaceChildren();if(!messages.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="mark">◈</div><h1>What’s on your mind?</h1><p>Start a conversation with your model.</p>';container.append(empty)}for(const message of messages){const row=document.createElement('div');row.className='message '+message.role;const role=document.createElement('div');role.className='role';role.textContent=message.role==='user'?'You':'TinyGPT';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.content;row.append(role,bubble);container.append(row)}container.scrollTop=container.scrollHeight}
async function history(){const chats=await api('/api/chats');$('history').replaceChildren();for(const chat of chats){const row=document.createElement('div');row.className='history-row';const button=document.createElement('button');button.textContent=chat.title;button.title=chat.title;button.className='chat-open'+(chat.id===current?' active':'');button.onclick=()=>openChat(chat.id);const remove=document.createElement('button');remove.className='chat-delete';remove.textContent='✕';remove.title='Delete conversation';remove.setAttribute('aria-label','Delete conversation: '+chat.title);remove.onclick=()=>deleteChat(chat);row.append(button,remove);$('history').append(row)}}
async function deleteChat(chat){if(busy)return;if(!confirm('Delete this conversation and its messages?'))return;try{await api('/api/chats/'+chat.id,{method:'DELETE'});if(current===chat.id){current=null;show([])}await history();status('Conversation deleted')}catch(e){status(e.message,true)}}
async function openChat(id){if(busy)return;try{current=id;show(await api('/api/chats/'+id));await history();status('')}catch(e){status(e.message,true)}}
function newChat(){if(busy)return;current=null;show([]);history().catch(e=>status(e.message,true));$('input').focus()}
$('new').onclick=newChat;$('newMobile').onclick=newChat;
$('input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('form').requestSubmit()}});
$('form').onsubmit=async event=>{event.preventDefault();const content=$('input').value.trim();if(!content||busy)return;busy=true;$('send').disabled=true;status('Generating response…');try{if(current===null){const chat=await api('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});current=chat.id}const messages=await api('/api/chats/'+current);const displayed=[...messages,{role:'user',content},{role:'assistant',content:''}];show(displayed);$('input').value='';const response=await fetch('/api/message/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:current,content,max_tokens:Number($('tokens').value),temperature:Number($('temperature').value),top_k:Number($('topk').value)})});if(!response.ok){const error=await response.json();throw new Error(error.error||'Request failed')}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',done=false;while(true){const part=await reader.read();buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});let newline;while((newline=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,newline);buffer=buffer.slice(newline+1);if(!line)continue;const event=JSON.parse(line);if(event.error)throw new Error(event.error);if(event.done)done=true;if(event.content){displayed[displayed.length-1].content+=event.content;show(displayed)}}if(part.done)break}if(!done)throw new Error('Generation ended before the response was saved');show(await api('/api/chats/'+current));await history();status('')}catch(e){$('input').value=content;status(e.message,true)}finally{busy=false;$('send').disabled=false}};
async function start(){show([]);try{const info=await api('/api/info');const fields=[['Model',info.model],['Tokenizer',info.tokenizer],['Device',info.device],['Parameters',info.parameters.toLocaleString()],['Context length',info.config.context_length],['Layers / heads',info.config.num_layers+' / '+info.config.n_heads],['Width',info.config.d_model],['Vocabulary',info.config.vocab_size],['Epoch',info.epoch??'—'],['Step',info.step??'—']];for(const [name,value] of fields){const item=document.createElement('div');item.className='detail';const label=document.createElement('label');label.textContent=name;const text=document.createElement('div');text.textContent=value;item.append(label,text);$('info').append(item)}await history()}catch(e){status(e.message,true)}}start();
</script></body></html>
